---
# fake accounts only; testa: no session bus (dbus-run-session), testb: logged in (session bus)
mailclient:
  providers:
    mailtestserver:
      imap: {host: localhost, port: 10993, security: ssl}
      smtp: {host: localhost, port: 10587, security: starttls}
      calendar_url: "https://localhost:15232/{address}/calendar/"
      contacts_url: "https://localhost:15232/{address}/contacts/"
  users:
    - user: testa
      accounts:
        - id: alice
          label: Alice (test)
          name: Alice Example
          address: alice@example.org
          provider: mailtestserver
        - id: bob
          address: bob@example.net
          imap: {host: imap.example.net, port: 993, security: ssl}
          smtp: {host: smtp.example.net, port: 465, security: ssl}
          folders: {junk: Spam}
    - user: testb
      accounts:
        - id: carol
          name: Carol Example
          address: carol@example.com
          provider: infomaniak
          dav_user: AB12345
          calendar_url: "https://sync.infomaniak.com/calendars/AB12345/00000000-0000-0000-0000-000000000000/"
          contacts_url: "https://sync.infomaniak.com/addressbooks/AB12345/00000000-0000-0000-0000-000000000000/"
